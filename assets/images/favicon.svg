<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with subtle luxury gradient & border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B0F17" stroke="url(#gold)" stroke-width="2"/>
  <!-- Muosirsoz 'M' Monogram in Gold -->
  <text x="32" y="44" font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">M</text>
</svg>
