<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#0B1329" rx="8"/>
  <rect x="50" y="50" width="500" height="350" fill="#131D38" stroke="#334155" stroke-width="3"/>
  <!-- Living room -->
  <rect x="50" y="50" width="320" height="230" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <text x="210" y="160" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Гостиная / Спальня</text>
  <text x="210" y="185" fill="#D4AF37" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">24.5 м²</text>
  <!-- Kitchen -->
  <rect x="370" y="50" width="180" height="230" fill="#1A253D" stroke="#475569" stroke-width="2"/>
  <text x="460" y="160" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Кухня</text>
  <text x="460" y="185" fill="#D4AF37" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">12.8 м²</text>
  <!-- Hallway -->
  <rect x="50" y="280" width="340" height="120" fill="#162035" stroke="#475569" stroke-width="2"/>
  <text x="200" y="340" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Прихожая / Холл (9.2 м²)</text>
  <!-- Bathroom -->
  <rect x="390" y="280" width="160" height="120" fill="#1A2744" stroke="#475569" stroke-width="2"/>
  <text x="470" y="340" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Санузел (5.5 м²)</text>
  <!-- Balcony -->
  <rect x="110" y="20" width="200" height="30" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4"/>
  <text x="210" y="40" fill="#D4AF37" font-family="sans-serif" font-size="11" text-anchor="middle">Лоджия (3.8 м²)</text>
</svg>