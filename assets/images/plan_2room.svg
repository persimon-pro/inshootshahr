<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#0B1329" rx="8"/>
  <rect x="40" y="40" width="520" height="370" fill="#131D38" stroke="#334155" stroke-width="3"/>
  <!-- Master Bedroom -->
  <rect x="40" y="40" width="240" height="210" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <text x="160" y="140" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Мастер-спальня</text>
  <text x="160" y="165" fill="#D4AF37" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">18.4 м²</text>
  <!-- Living room -->
  <rect x="280" y="40" width="280" height="210" fill="#1A253D" stroke="#475569" stroke-width="2"/>
  <text x="420" y="140" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Гостиная-зал</text>
  <text x="420" y="165" fill="#D4AF37" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">26.2 м²</text>
  <!-- Kitchen -->
  <rect x="40" y="250" width="210" height="160" fill="#162035" stroke="#475569" stroke-width="2"/>
  <text x="145" y="330" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Кухня (14.0 м²)</text>
  <!-- Hall -->
  <rect x="250" y="250" width="170" height="160" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <text x="335" y="330" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Холл (10.6 м²)</text>
  <!-- Bathroom -->
  <rect x="420" y="250" width="140" height="160" fill="#1A2744" stroke="#475569" stroke-width="2"/>
  <text x="490" y="330" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Санузел (6.8 м²)</text>
</svg>